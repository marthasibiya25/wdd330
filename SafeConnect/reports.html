<!DOCTYPE html>
<html>

<head>
    <title>Reports</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <h1>Alert History</h1>

    <ul id="list"></ul>

    <script>
        let alerts = JSON.parse(localStorage.getItem("alerts")) || [];

        const list = document.getElementById("list");

        alerts.forEach(a => {
            const li = document.createElement("li");
            li.innerHTML = `
        🚨 ${a.time}<br>
        📍 ${a.latitude}, ${a.longitude}
    `;
            list.appendChild(li);
        });
    </script>

</body>

</html>
