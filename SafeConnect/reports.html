<!DOCTYPE html>
<html>

<head>
    <title>Reports</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <h1>Alert History</h1>

    <ul id="list"></ul>

    <script>
        const list = document.getElementById("list");
        const alerts = JSON.parse(localStorage.getItem("alerts")) || [];

        if (alerts.length === 0) {
            list.innerHTML = "<p>No alerts yet</p>";
        }

        alerts.forEach(a => {
            const li = document.createElement("li");
            li.innerHTML = `
            🚨 Emergency Alert<br>
            📍 ${a.latitude}, ${a.longitude}<br>
            ⏰ ${a.time}
        `;
            list.appendChild(li);
        });
    </script>

</body>

</html>
