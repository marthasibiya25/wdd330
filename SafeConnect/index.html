<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeConnect</title>

    <link rel="stylesheet" href="css/styles.css">
    
</head>

<body>

    <header>
        <h1>SafeConnect</h1>
        <p>Community Safety Alert System</p>
    </header>

    <main>
        <section class="hero">
            <h2>Stay Safe. Stay Connected.</h2>

            <p>
                Report emergencies and share your location quickly with trusted contacts.
            </p>

            <button id="alertBtn">
                Emergency Alert
            </button>
            <button aria-label="Send Emergency Alert"></button>

            <p>
                <a href="contacts.html">
                    Manage Trusted Contacts
                </a>
            </p>

            <div id="locationInfo">
                Location will appear here.
            </div>

            <iframe width="100%" height="400"
                src="https://www.openstreetmap.org/export/embed.html?bbox=28.0,-26.3,28.1,-26.1&layer=mapnik"
                style="border:1px solid black">
            </iframe>

            <button onclick="logout()">Logout</button>

        </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/map.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
